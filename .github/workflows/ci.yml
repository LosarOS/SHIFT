name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: python tools/audit_source.py
      - run: dotnet restore tests/Shift.Tests --locked-mode --nologo
      - run: dotnet test tests/Shift.Tests -c Release --no-restore --nologo --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: TestResults/*.trx
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tools/Shift.Diagnostics --locked-mode --nologo
      - run: dotnet run --project tools/Shift.Diagnostics -c Release --no-restore -- --output artifacts/core-diagnostics.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-diagnostics
          path: artifacts/core-diagnostics.json
  windows-app:
    runs-on: windows-latest
    env:
      SHIFT_STARTUP_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }
      - name: Prepare isolated native crash diagnostics
        shell: pwsh
        run: ./packaging/Prepare-NativeDiagnostics.ps1
      - name: Build installer and portable
        shell: pwsh
        run: ./packaging/Build-Release.ps1 -Version 1.0.0-rc.5
      - name: Installer smoke
        shell: pwsh
        run: ./packaging/Smoke-Installer.ps1 -Version 1.0.0-rc.5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: SHIFT-Windows-candidate
          path: |
            artifacts/*.zip
            artifacts/*setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/diagnostics/**
