name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Shift.Tests --locked-mode --nologo
      - run: dotnet test tests/Shift.Tests -c Release --no-restore --nologo --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: TestResults/*.trx
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build installer and portable
        shell: pwsh
        run: ./packaging/Build-Release.ps1 -Version 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: SHIFT-Windows-preview
          path: |
            artifacts/*.zip
            artifacts/*setup.exe
            artifacts/SHA256SUMS.txt
