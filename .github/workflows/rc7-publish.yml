name: RC7 canonical publication
on:
  push:
    branches: ['release/rc7-publish']
    paths: ['.github/workflows/rc7-publish.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: LosarOS/SHIFT
      SOURCE_SHA: '7bb1760b7095bcc254b25807b9eb2934cd807919'
      VERIFIED_CI: '41521398106'
    steps:
      - name: Verify accepted main source and dispatch canonical tagged build
        shell: python
        run: |
          import json, os, subprocess, time
          repo=os.environ['GH_REPO'];source=os.environ['SOURCE_SHA'];tag='v1.0.0-rc.7'
          def api(path,body=None):
              command=['gh','api','repos/'+repo+'/'+path]
              if body is not None:command+=['--method','POST','--input','-']
              r=subprocess.run(command,input=None if body is None else json.dumps(body),capture_output=True,text=True,check=True)
              return json.loads(r.stdout) if r.stdout.strip() else None
          deadline=time.monotonic()+1200
          while True:
              assert api('branches/main')['commit']['sha']==source,'Main moved; publication refused.'
              ci=api('actions/runs/'+os.environ['VERIFIED_CI'])
              assert ci['head_sha']==source and ci['event']=='push' and ci['head_branch']=='main'
              if ci['status']=='completed':break
              assert time.monotonic()<deadline,'Final CI timed out.'
              time.sleep(20)
          assert ci['conclusion']=='success','Final main CI is not green.'
          pr=api('pulls/22');assert pr['merged'] and pr['merge_commit_sha']==source
          jobs=api('actions/runs/'+os.environ['VERIFIED_CI']+'/jobs')['jobs']
          required={'core (ubuntu-latest)','core (windows-latest)','diagnostics','windows-app'}
          assert {j['name'] for j in jobs}>=required and all(j['conclusion']=='success' for j in jobs if j['name'] in required)
          refs=api('git/matching-refs/tags/'+tag)
          assert not any(r['ref']=='refs/tags/'+tag for r in refs),'Existing tag is immutable.'
          assert not any(r['tag_name']==tag for r in api('releases?per_page=100')),'Existing release is immutable.'
          obj=api('git/tags',{'tag':tag,'message':'SHIFT RC7: reviewed workspace composition, launch plans and atomic Studio persistence','object':source,'type':'commit'})
          api('git/refs',{'ref':'refs/tags/'+tag,'sha':obj['sha']})
          assert api('commits/'+tag)['sha']==source
          # Token-generated tag pushes do not start another workflow; explicit
          # workflow_dispatch is the supported exception. Canonical gates stay intact.
          subprocess.run(['gh','workflow','run','release.yml','--ref',tag,'-f','version=1.0.0-rc.7','-f','verify_existing=false'],check=True)
          print('Canonical tagged workflow dispatched:',tag,source)
